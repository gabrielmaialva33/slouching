name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: proto sync and shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The submodules stay uninitialized: the proto check fetches only the
      # pinned commits' schema, and the full gates run in each code repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Protobuf schema matches the pinned submodule commits
        run: ./scripts/check-proto-sync.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh
